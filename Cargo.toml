[workspace]
resolver = "3"
members = ["crates/darkroom", "crates/darkroom-core", "crates/darkroom-render"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.0.2"

[workspace.dependencies]
# RUNE is pre-release: pin a `dev` rev, and patch the same crates RUNE patches, from the same rev
# (a dependency's [patch] doesn't reach this workspace). Bump all five together.
rune = { git = "https://github.com/anomalyco/rune", rev = "740ecbc96902fe0008745de61cd3b732fb407a6b", features = ["native-file-dialog"] }
# Must stay on RUNE's wgpu so our textures and pipelines live on the device RUNE hands us.
wgpu = { version = "~30.0.1", default-features = false, features = ["std", "wgsl"] }
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
half = "2"
kamadak-exif = "0.6"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
darkroom-core = { path = "crates/darkroom-core" }
darkroom-render = { path = "crates/darkroom-render" }

[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "740ecbc96902fe0008745de61cd3b732fb407a6b" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "740ecbc96902fe0008745de61cd3b732fb407a6b" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "740ecbc96902fe0008745de61cd3b732fb407a6b" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "740ecbc96902fe0008745de61cd3b732fb407a6b" }

[profile.dev]
debug = "line-tables-only"

# Image decoding and resizing are painfully slow unoptimized.
[profile.dev.package."*"]
opt-level = 2
debug = false

# rawler's X-Trans demosaic indexes with wrapping arithmetic; it is written for release builds.
[profile.dev.package.rawler]
opt-level = 3
overflow-checks = false
